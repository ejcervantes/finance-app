services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: finance
      POSTGRES_PASSWORD: finance
      POSTGRES_DB: finance
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finance"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      # La app las lee vía app/core/config.py
      DATABASE_URL: postgresql+asyncpg://finance:finance@db:5432/finance
      JWT_SECRET_KEY: dev-secret-cambiar-en-produccion
      # GEMINI_API_KEY se agrega cuando implementemos las features de IA
    ports:
      - "8000:8000"
    volumes:
      # Monta el código para hot-reload en desarrollo
      - ./backend:/code
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  pgdata:
