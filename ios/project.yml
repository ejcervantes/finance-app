name: FinanceCalc
options:
  bundleIdPrefix: com.financecalc
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGNING_ALLOWED: NO   # dev en simulador, sin firma

targets:
  FinanceCalc:
    type: application
    platform: iOS
    sources:
      - path: FinanceCalc
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.financecalc.app
        TARGETED_DEVICE_FAMILY: "1"   # iPhone
    info:
      path: FinanceCalc/Info.plist
      properties:
        CFBundleDisplayName: Finanzas
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Permite HTTP a localhost en desarrollo (el backend corre en localhost:8000)
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # Permisos para el escaneo de recibos
        NSCameraUsageDescription: "Se usa para tomar foto de tus recibos de compra."
        NSPhotoLibraryUsageDescription: "Se usa para elegir la foto de un recibo."
